[project]
name = "langflow-feature-delivery"
version = "0.1.0"
description = "Feature delivery multi-agent pipeline with Langflow (UI + REST API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "ddgs>=9.0.0",
  "openai>=1.0.0",
  "feature-delivery-tui @ file:../shared/feature-delivery-tui",
  "feature-delivery-api @ file:../shared/feature-delivery-api",
]

[project.scripts]
feature-delivery = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
