[project]
name = "feature-delivery-api"
version = "0.1.0"
description = "HTTP API (FastAPI) for feature-delivery agent labs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["feature_delivery_api*"]
